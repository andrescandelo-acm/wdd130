<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Contact White Water Rafting in Kolob, California. Call, email, or send a message to ask about trips, reservations, or website suggestions.">
    <meta name="author" content="Andres Candelo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo_z-splash.png" alt="White Water Rafting Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </section>

        <div class="contact-layout">
            <iframe src="https://www.google.com/maps?q=Kolob+Canyons,+Utah&output=embed"
              title="Map showing the White Water Rafting Company location" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>

            <form class="contact-form" action="#" method="post">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name"
                      placeholder="Your name" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email"
                      placeholder="you@example.com" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="choice">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>
                    </div>
                    <div class="choice">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div class="choice">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="choice">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <ul class="team-list">
                <li>
                    <figure>
                        <img src="images/Elene_Rivera.png"
                          alt="Portrait of Alex Rivera, head river guide" width="160" height="160"
                          loading="lazy">
                        <figcaption>Alex Rivera<br>Head River Guide</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="images/Maria_Santos.png"
                          alt="Portrait of Maria Santos, reservations manager" width="160"
                          height="160" loading="lazy">
                        <figcaption>Maria Santos<br>Reservations Manager</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="images/Sam_Carter.png"
                          alt="Portrait of Sam Carter, safety coordinator" width="160" height="160"
                          loading="lazy">
                        <figcaption>Sam Carter<br>Safety Coordinator</figcaption>
                    </figure>
                </li>
            </ul>
        </section>
    </main>

    <!-- REPLACE this footer with the exact <footer> from about.html -->
    <footer>
        <p>Footer content including social media icons and links</p>
    </footer>
</body>

</html>
