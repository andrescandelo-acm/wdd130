<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&amp;display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>

        <form action="#" method="post">
            <div class="question">
                <label for="q1">Which HTML element is used to create a hyperlink? Type the tag name
                    without angle brackets.</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="question">
                <label for="q2">In your own words, explain the difference between an id and a
                    class.</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <div class="question">
                <label for="q3">Which CSS property adds space between an element's content and its
                    border?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="margin">margin</option>
                    <option value="padding">padding</option>
                    <option value="spacing">spacing</option>
                </select>
            </div>

            <div class="question">
                <label for="q4">What is the bottom margin, in pixels, given this
                    declaration?</label>
                <pre><code>margin: 10px 5px 15px;</code></pre>
                <input type="number" id="q4" name="q4" min="0">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
