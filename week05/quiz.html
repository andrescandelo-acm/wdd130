<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>HTML and CSS Quiz</h1>
        <p class="intro">Answer all four questions, then submit your quiz.</p>

        <form action="#" method="post">
            <div class="question">
                <label for="q1">1. Which HTML element is used to create a hyperlink? Type the tag
                    name without angle brackets.</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="question">
                <label for="q2">2. In your own words, explain the difference between an id and a
                    class.</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <div class="question">
                <label for="q3">3. Which CSS property adds space between an element's content and
                    its border?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose one ...</option>
                    <option value="margin">margin</option>
                    <option value="padding">padding</option>
                    <option value="spacing">spacing</option>
                </select>
            </div>

            <div class="question">
                <label for="q4">4. How many levels of headings does HTML provide (h1, h2, and so
                    on)?</label>
                <input type="number" id="q4" name="q4" min="0">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
